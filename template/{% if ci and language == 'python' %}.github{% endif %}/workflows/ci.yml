# Lint, format and test on GitHub Actions, using the same just recipes as local development.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: jdx/mise-action@v5
        with:
          install_args: ast-grep
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: just lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: just test
