_subdirectory: template
_min_copier_version: "9.0.0"

_tasks:
  - command: "[ -e .git ] || (git init -b main && git add -A && git commit -m 'Initial commit from project-template')"

project_name:
  type: str
  help: Project name

project_description:
  type: str
  help: One-sentence description of the project

language:
  type: str
  help: Programming language
  choices:
    - python
    - typescript
    - rust
    - java

project_kind:
  type: str
  help: Kind of project
  choices:
    - library
    - application
    - service

spring_boot:
  type: bool
  help: Use Spring Boot?
  default: false
  when: "{{ language == 'java' }}"

package_name:
  type: str
  when: false
  default: >-
    {% set name = project_name | lower | regex_replace('[^a-z0-9]+', '_') | trim('_') -%}
    {% if not name -%}
    project
    {%- elif name[:1] in '0123456789' or name in ['False', 'None', 'True', 'and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield'] -%}
    p_{{ name }}
    {%- else -%}
    {{ name }}
    {%- endif %}
