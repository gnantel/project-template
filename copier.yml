_subdirectory: template
_min_copier_version: "9.0.0"

_tasks:
  # TypeScript runs two tasks around the shared initial commit: pnpm install comes
  # first so pnpm-lock.yaml is in that commit, and lefthook install comes after it
  # because it needs the .git directory the shared task creates.
  - command: "mise trust && mise install && mise exec -- pnpm install"
    when: "{{ language == 'typescript' }}"
  - command: "[ -e .git ] || (git init -b main && git add -A && git commit -m 'Initial commit from project-template')"
  - command: "uv run lefthook install"
    when: "{{ language == 'python' }}"
  - command: "mise trust && mise install && mise exec -- lefthook install"
    when: "{{ language in ['rust', 'java'] }}"
  - command: "mise exec -- pnpm exec lefthook install"
    when: "{{ language == 'typescript' }}"

project_name:
  type: str
  help: Project name

project_description:
  type: str
  help: One-sentence description of the project

language:
  type: str
  help: Programming language
  choices:
    - python
    - typescript
    - rust
    - java

project_kind:
  type: str
  help: Kind of project
  choices:
    - library
    - application
    - service

spring_boot:
  type: bool
  help: Use Spring Boot?
  default: false
  when: "{{ language == 'java' }}"

java_keywords:
  type: yaml
  when: false
  default: >-
    [abstract, assert, boolean, break, byte, case, catch, char, class, const,
    continue, default, do, double, else, enum, extends, "false", final,
    finally, float, for, goto, if, implements, import, instanceof, int,
    interface, long, native, new, "null", package, private, protected, public,
    return, short, static, strictfp, super, switch, synchronized, this, throw,
    throws, transient, "true", try, void, volatile, while]

java_group_id:
  type: str
  help: Maven group id, also the root of the Java package
  default: com.example
  when: "{{ language == 'java' }}"
  validator: >-
    {% set segments = java_group_id.split('.') -%}
    {% if not (java_group_id | regex_search('^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*$')) -%}
    Use lowercase dot-separated segments, such as com.example
    {%- elif segments | select('in', java_keywords) | list -%}
    Segments cannot be Java keywords, such as class or int
    {%- endif %}

stdlib_module_names:
  type: yaml
  when: false
  default: >-
    [abc, aifc, antigravity, argparse, array, ast, asyncio, atexit, audioop,
    base64, bdb, binascii, bisect, builtins, bz2, cProfile, calendar, cgi,
    cgitb, chunk, cmath, cmd, code, codecs, codeop, collections, colorsys,
    compileall, concurrent, configparser, contextlib, contextvars, copy,
    copyreg, crypt, csv, ctypes, curses, dataclasses, datetime, dbm,
    decimal, difflib, dis, doctest, email, encodings, ensurepip, enum,
    errno, faulthandler, fcntl, filecmp, fileinput, fnmatch, fractions,
    ftplib, functools, gc, genericpath, getopt, getpass, gettext, glob,
    graphlib, grp, gzip, hashlib, heapq, hmac, html, http, idlelib, imaplib,
    imghdr, importlib, inspect, io, ipaddress, itertools, json, keyword,
    lib2to3, linecache, locale, logging, lzma, mailbox, mailcap, marshal,
    math, mimetypes, mmap, modulefinder, msilib, msvcrt, multiprocessing,
    netrc, nis, nntplib, nt, ntpath, nturl2path, numbers, opcode, operator,
    optparse, os, ossaudiodev, pathlib, pdb, pickle, pickletools, pipes,
    pkgutil, platform, plistlib, poplib, posix, posixpath, pprint, profile,
    pstats, pty, pwd, py_compile, pyclbr, pydoc, pydoc_data, pyexpat, queue,
    quopri, random, re, readline, reprlib, resource, rlcompleter, runpy,
    sched, secrets, select, selectors, shelve, shlex, shutil, signal, site,
    smtplib, sndhdr, socket, socketserver, spwd, sqlite3, sre_compile,
    sre_constants, sre_parse, ssl, stat, statistics, string, stringprep,
    struct, subprocess, sunau, symtable, sys, sysconfig, syslog, tabnanny,
    tarfile, telnetlib, tempfile, termios, textwrap, this, threading, time,
    timeit, tkinter, token, tokenize, tomllib, trace, traceback,
    tracemalloc, tty, turtle, turtledemo, types, typing, unicodedata,
    unittest, urllib, uu, uuid, venv, warnings, wave, weakref, webbrowser,
    winreg, winsound, wsgiref, xdrlib, xml, xmlrpc, zipapp, zipfile,
    zipimport, zlib, zoneinfo]

python_keywords:
  type: yaml
  when: false
  default: >-
    [and, as, assert, async, await, break, class, continue, def, del, elif,
    else, except, "false", finally, for, from, global, if, import, in, is,
    lambda, none, nonlocal, not, or, pass, raise, return, "true", try, while,
    with, yield]

ci:
  type: bool
  help: Generate a GitHub Actions CI workflow (lint, then test)?
  default: false
  when: "{{ language in ['python', 'rust', 'typescript', 'java'] }}"

package_name:
  type: str
  when: false
  default: >-
    {% set name = project_name | lower | regex_replace('[^a-z0-9]+', '_') | trim('_') -%}
    {% set is_unsafe = name[:1] in '0123456789' or name in python_keywords or name in stdlib_module_names -%}
    {% if not name -%}
    project
    {%- elif is_unsafe -%}
    p_{{ name }}
    {%- else -%}
    {{ name }}
    {%- endif %}

java_package:
  type: str
  when: false
  default: >-
    {% set name = project_name | lower | regex_replace('[^a-z0-9]+', '') -%}
    {% set is_unsafe = name[:1] in '0123456789' or name in java_keywords -%}
    {{ java_group_id }}.{% if not name %}project{% elif is_unsafe %}p{{ name }}{% else %}{{ name }}{% endif %}

java_class_prefix:
  type: str
  when: false
  default: >-
    {% set name = project_name | regex_replace('[^A-Za-z0-9]+', ' ') | title | replace(' ', '') -%}
    {% if not name -%}
    Project
    {%- elif name[:1] in '0123456789' -%}
    P{{ name }}
    {%- elif name in ['Spring', 'SpringBoot'] -%}
    {{ name }}App
    {%- else -%}
    {{ name }}
    {%- endif %}

java_artifact_id:
  type: str
  when: false
  default: >-
    {{ project_name | lower | regex_replace('[^a-z0-9]+', '-') | trim('-') or 'project' }}

palantir_java_format_version:
  type: str
  when: false
  default: "2.103.0"

java_package_path:
  type: str
  when: false
  default: "{{ java_package | replace('.', '/') }}"
